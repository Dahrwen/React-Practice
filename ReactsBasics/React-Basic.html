<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const button = <button>Hello</button>;
      const paragraph = <p>paragraph of text</p>;
      const productCost = 10;
      const shippingCost = 5;

      const div = (
        <div>
            <p>Product Cost ${productCost}</p>
            <p>Shipping Cost ${shippingCost}</p>
            <p>Total Cost ${productCost + shippingCost}</p>
            <button>Place Order</button>
        </div>
      );

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      /*ReactDOM.createRoot(container).render('Welcome to SuperSimpleDev React Course');
        ReactDOM.createRoot(container).render(button);
        ReactDOM.createRoot(container).render(paragraph);*/

      setInterval(() => {
        const currentTime = dayjs().format('HH:mm:ss');
        root.render(
          <p>Current time: {currentTime}</p>
        );
      }, 1000);

        console.log((1*10)+(2*8));
        console.log('Today is', dayjs().format('MMMM D'));
        console.log('Current Time is', dayjs().format('HH:MM:SS'));
        root.render(div);
    </script>
  </body>

</html>
